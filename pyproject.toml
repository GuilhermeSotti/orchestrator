[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator-core"
version = "0.1.0"
description = "Hexagonal runtime core for orchestrator workflows"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Guilherme Pires de Sotti Machado" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
orchestrator = "orchestrator_core.main:cli"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
