name: Release

on:
  push:
    tags: ["orchestrator-*/v*"]

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Ferramentas
        run: python -m pip install -r requirements/dev.txt
      - name: Testes
        run: python -m pytest
      - name: Build reproduzível do pacote da tag
        shell: bash
        run: |
          package="${GITHUB_REF_NAME%%/v*}"
          version="${GITHUB_REF_NAME##*/v}"
          python tools/build_packages.py --check --package "$package" --out dist
          module="${package//-/_}"
          ls dist | grep -q "^${module}-${version}-" || { echo "a versão do pacote não corresponde à tag"; exit 1; }
          echo "PACKAGE=$package" >> "$GITHUB_ENV"
      - name: Release no GitHub (sem publicação em índice de pacotes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes "Notas: packages/${PACKAGE}/CHANGELOG.md. Hashes SHA-256 no arquivo SHA256SUMS."
