version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /requirements
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-tools:
        patterns: ["*"]
    labels: [dependencies]
    commit-message:
      prefix: build
