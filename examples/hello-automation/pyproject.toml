[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-automation"
version = "0.1.0"
description = "Minimal consumer project of the Orchestrator platform (orchestrator-core only)."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Orchestrator Contributors" }]
dependencies = ["orchestrator-core>=0.1,<0.2"]

[project.scripts]
hello-automation = "hello_automation.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
