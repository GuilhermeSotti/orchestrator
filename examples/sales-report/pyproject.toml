[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sales-report"
version = "0.1.0"
description = "Consumer project of the Orchestrator platform using the SQL Capability and the SQLite Provider."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Orchestrator Contributors" }]
dependencies = [
    "orchestrator-core>=0.1,<0.2",
    "orchestrator-sql>=0.1,<0.2",
    "orchestrator-sqlite>=0.1,<0.2",
]

[project.scripts]
sales-report = "sales_report.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
