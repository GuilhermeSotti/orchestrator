[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "batch-check"
version = "0.1.0"
description = "Consumer project of the Orchestrator platform that demonstrates notifications (SMTP and Teams channels)."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Orchestrator Contributors" }]
dependencies = [
    "orchestrator-core>=0.2,<0.3",
    "orchestrator-notifications>=0.1,<0.2",
    "orchestrator-notifications-smtp>=0.1,<0.2",
    "orchestrator-notifications-teams>=0.1,<0.2",
]

[project.scripts]
batch-check = "batch_check.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
