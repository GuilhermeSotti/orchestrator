[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator-core"
dynamic = ["version"]
description = "Runtime, execution pipeline and contracts for Capabilities and Providers of the Orchestrator platform."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Orchestrator Contributors" }]
keywords = ["automation", "orchestration", "pipeline", "runtime", "lifecycle"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = []

[tool.setuptools.dynamic]
version = { attr = "orchestrator_core._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orchestrator_core = ["py.typed"]
