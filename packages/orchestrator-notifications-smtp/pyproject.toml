[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator-notifications-smtp"
dynamic = ["version"]
description = "E-mail channel (SMTP) for the notifications Capability of the Orchestrator platform, with the standard library only."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Orchestrator Contributors" }]
keywords = ["automation", "orchestration", "notifications", "smtp", "email"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Communications",
    "Typing :: Typed",
]
dependencies = ["orchestrator-core>=0.2,<0.3", "orchestrator-notifications>=0.1,<0.2"]

[tool.setuptools.dynamic]
version = { attr = "orchestrator_notifications_smtp._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orchestrator_notifications_smtp = ["py.typed"]
