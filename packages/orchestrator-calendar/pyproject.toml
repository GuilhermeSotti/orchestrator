[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator-calendar"
dynamic = ["version"]
description = "Business calendars of the Orchestrator platform: declared weekend, manually maintained holidays in layers, coverage and explanations, with the standard library only."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Orchestrator Contributors" }]
keywords = ["automation", "orchestration", "calendar", "holidays", "business-days"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Scheduling",
    "Typing :: Typed",
]
dependencies = ["orchestrator-core>=0.2,<0.3"]

[tool.setuptools.dynamic]
version = { attr = "orchestrator_calendar._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orchestrator_calendar = ["py.typed"]
